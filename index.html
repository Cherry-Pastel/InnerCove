    const resultArea = document.getElementById('resultArea');
    const singleBtn = document.getElementById('singleBtn');
    const tripleBtn = document.getElementById('tripleBtn');
    const resetBtn = document.getElementById('resetBtn');

    let usedCards = [];

    // =========================
    // 背景變色
    // =========================

    function changeBackground() {
      const gradients = [
        'linear-gradient(-45deg, #1C2E4A, #244166, #2B4C7E, #355f99)',
        'linear-gradient(-45deg, #2B3A67, #496A81, #6699CC, #4A6FA5)',
        'linear-gradient(-45deg, #243B55, #141E30, #365C7D, #4B79A1)',
        'linear-gradient(-45deg, #1D4350, #A43931, #355C7D, #6C5B7B)',
        'linear-gradient(-45deg, #355C7D, #6C5B7B, #C06C84, #355C7D)'
      ];

      document.body.style.background = gradients[Math.floor(Math.random() * gradients.length)];
      document.body.style.backgroundSize = '400% 400%';
    }

    // =========================
    // 洗牌
    // =========================

    function getRandomCard() {
      const availableCards = deck.filter(card => !usedCards.includes(card.id));

      if (availableCards.length === 0) {
        usedCards = [];
      }

      const randomCard = availableCards[Math.floor(Math.random() * availableCards.length)];

      usedCards.push(randomCard.id);

      return randomCard;
    }

    // =========================
    // 卡片 HTML
    // =========================

    function createCard(card, label = '') {
      return `
        <div class="flip-card card-hover fade-in mt-6">

                看見此刻的內在風景
              </p>

            <div class="flip-card-back glass-card text-left">

              <img src="${card.image}" alt="${card.name}" class="card-image">

                ${label ? `<div class="card-label text-sm text-white/60 mb-3">${label}</div>` : ''}

                    </div>
                    <p>${card.description}</p>
                  </div>

                  <div>
                    <div class="text-cyan-100 mb-2 font-semibold tracking-wide">

                    </div>
                    <p>${card.advice}</p>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================

    singleBtn.addEventListener('click', () => {

      resultArea.innerHTML = '';
      changeBackground();

      const card = getRandomCard();

      resultArea.innerHTML = `
        <div class="max-w-md mx-auto">

      activateFlip();

    // =========================

    tripleBtn.addEventListener('click', () => {

      resultArea.innerHTML = '';
      changeBackground();

      const card1 = getRandomCard();
      const card2 = getRandomCard();
      const card3 = getRandomCard();

      resultArea.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

          ${createCard(card1, '現在')}

          ${createCard(card2, '阻礙')}

      `;

    });

    resetBtn.addEventListener('click', () => {
      resultArea.innerHTML = `

    });

    // =========================
    // 翻牌事件
    // =========================

    function activateFlip() {
      const cards = document.querySelectorAll('.flip-card');

      cards.forEach(card => {
        setTimeout(() => {
          card.classList.add('flipped');
        }, 300);

        card.addEventListener('click', () => {
          card.classList.toggle('flipped');
        });
      });
    }

    // 初始提示
    resultArea.innerHTML = `

  </script>
